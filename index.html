<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0d4f4a">
<meta name="description" content="Roteiro, custos e mapa de atrações para as viagens de Rodolfo e Rita.">
<title>Nossas Viagens</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/favicon.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nossas Viagens">
<style>
:root{
  --agua:#0d4f4a; --agua-2:#12706a; --agua-3:#1c8f86;
  --areia:#f6f3ec; --papel:#ffffff; --tinta:#15201f; --tinta-2:#4c5c5a;
  --linha:#e2dfd6; --sol:#e08a2c; --sol-fraco:#fdf1e0;
  --alerta:#c2410c; --alerta-fraco:#fff1ea; --ok:#15803d; --ok-fraco:#eaf6ee;
  --br:#1c8f86; --py:#b3452e; --ar:#3b6fb5;
  --r:14px; --r-p:10px; --sombra:0 1px 2px rgba(21,32,31,.06),0 4px 16px rgba(21,32,31,.07);
  --toque:48px;
  --topo:env(safe-area-inset-top,0px); --base:env(safe-area-inset-bottom,0px);
  --esq:env(safe-area-inset-left,0px); --dir:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --areia:#111817; --papel:#1a2322; --tinta:#eef3f2; --tinta-2:#9fb0ae;
    --linha:#2c3937; --sol:#f0a44f; --sol-fraco:#332617;
    --alerta:#fb923c; --alerta-fraco:#361d10; --ok:#4ade80; --ok-fraco:#12291b;
    --agua:#0b3d39; --agua-2:#1c8f86; --agua-3:#2bb3a7;
    --sombra:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--areia); color:var(--tinta);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--agua-2)}

/* ---------- topo ---------- */
#barraTopo{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--topo) + 10px) calc(var(--dir) + 16px) 10px calc(var(--esq) + 16px);
  background:var(--agua); color:#fff;
  display:flex;align-items:center;gap:10px;
}
@media (prefers-color-scheme: dark){ #barraTopo{background:#0b3d39} }
#barraTopo h1{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#barraTopo .sub{display:block;font-size:12px;font-weight:400;opacity:.8;letter-spacing:0}
.btTopo{
  min-width:44px;height:44px;border-radius:12px;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;
  background:rgba(255,255,255,.14);font-size:13px;font-weight:600;
}
.btTopo:active{background:rgba(255,255,255,.28)}

/* ---------- corpo ---------- */
#corpo{
  padding:14px calc(var(--dir) + 14px) calc(var(--base) + 96px) calc(var(--esq) + 14px);
  max-width:780px;margin:0 auto;
}
.tela{display:none}
.tela.on{display:block;animation:entra .18s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- cartões ---------- */
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra);margin-bottom:12px;overflow:hidden}
.cartao.pad{padding:14px}
.tituloSecao{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-2)}
.tituloSecao:first-child{margin-top:2px}
.tituloSecao .linha{flex:1;height:1px;background:var(--linha)}

/* ---------- botões ---------- */
.bt{
  min-height:var(--toque);border-radius:12px;padding:0 18px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:650;font-size:15px;background:var(--agua-2);color:#fff;
}
.bt:active{transform:scale(.98)}
.bt.sec{background:var(--papel);color:var(--tinta);border:1px solid var(--linha)}
.bt.fant{background:transparent;color:var(--agua-2);border:1px solid var(--linha)}
.bt.perigo{background:transparent;color:var(--alerta);border:1px solid var(--alerta)}
.bt.larga{width:100%}
.bt[disabled]{opacity:.45;pointer-events:none}
.btIcone{width:var(--toque);height:var(--toque);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;color:var(--tinta-2)}
.btIcone:active{background:var(--linha)}

/* ---------- etiquetas ---------- */
.eti{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--linha);color:var(--tinta-2);white-space:nowrap}
.eti.br{background:rgba(28,143,134,.14);color:var(--br)}
.eti.py{background:rgba(179,69,46,.14);color:var(--py)}
.eti.ar{background:rgba(59,111,181,.15);color:var(--ar)}
.eti.sol{background:var(--sol-fraco);color:var(--sol)}
.eti.ok{background:var(--ok-fraco);color:var(--ok)}
.eti.alerta{background:var(--alerta-fraco);color:var(--alerta)}
@media (prefers-color-scheme: dark){ .eti.br{background:rgba(43,179,167,.18)} .eti.py{background:rgba(230,120,90,.18);color:#e6785a} .eti.ar{background:rgba(120,160,230,.18);color:#88aae8} }

/* ---------- aviso ---------- */
.aviso{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-p);font-size:13.5px;line-height:1.4;margin-bottom:10px;border:1px solid transparent}
.aviso .ic{flex:0 0 auto;font-size:16px;line-height:1.2}
.aviso.at{background:var(--alerta-fraco);border-color:rgba(194,65,12,.25);color:var(--alerta)}
.aviso.in{background:var(--sol-fraco);border-color:rgba(224,138,44,.25);color:var(--sol)}
.aviso.bo{background:var(--ok-fraco);border-color:rgba(21,128,61,.22);color:var(--ok)}
.aviso b{font-weight:700}

/* ---------- roteiro ---------- */
.dia{margin-bottom:14px}
.cabDia{
  position:sticky;top:var(--alturaTopo,86px);z-index:20;
  background:var(--areia);padding:8px 2px 8px;display:flex;align-items:baseline;gap:8px;
}
.cabDia .n{font-size:17px;font-weight:750}
.cabDia .d{font-size:13px;color:var(--tinta-2);flex:1}
.cabDia .tot{font-size:12.5px;font-weight:700;color:var(--tinta-2)}
.item{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--linha);align-items:flex-start}
.item:last-child{border-bottom:0}
.item .hora{flex:0 0 54px;font-size:13px;font-weight:750;color:var(--agua-2);padding-top:2px;font-variant-numeric:tabular-nums}
.item .corpo{flex:1;min-width:0}
.item .nome{font-weight:650;font-size:15.5px;line-height:1.3}
.item .meta{font-size:12.5px;color:var(--tinta-2);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.item .obs{font-size:12.5px;color:var(--tinta-2);margin-top:5px;line-height:1.4}
.item.voo{background:linear-gradient(90deg,rgba(13,79,74,.07),transparent)}
.item.voo .hora{color:var(--tinta-2)}
.item .acao{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
.desloc{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 80px;font-size:12px;color:var(--tinta-2);background:repeating-linear-gradient(180deg,transparent,transparent 3px,var(--linha) 3px,var(--linha) 4px) 66px 0/1px 100% no-repeat}
.desloc.aviso2{color:var(--alerta);font-weight:600}
.vazioDia{padding:18px 14px;text-align:center;color:var(--tinta-2);font-size:13.5px}

/* ---------- lista de atrações ---------- */
.filtros{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:var(--toque);padding:0 15px;border-radius:999px;border:1px solid var(--linha);
  background:var(--papel);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--tinta-2)
}
.chip[aria-pressed="true"]{background:var(--agua-2);border-color:var(--agua-2);color:#fff}
.atr{display:flex;align-items:stretch;border-bottom:1px solid var(--linha)}
.atr:last-child{border-bottom:0}
.marcar{
  flex:0 0 var(--toque);min-height:var(--toque);display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--linha);font-size:20px;color:var(--tinta-2);align-self:stretch;
}
.marcar[aria-pressed="true"]{background:var(--ok-fraco);color:var(--ok)}
.atr .info{flex:1;min-width:0;padding:11px 12px}
.atr .n{font-weight:650;font-size:15px;line-height:1.3}
.atr .m{font-size:12.5px;color:var(--tinta-2);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px 9px;align-items:center}
.atr .abrir{flex:0 0 44px;display:flex;align-items:center;justify-content:center;color:var(--tinta-2);font-size:18px}
.atr.escolhida .n{color:var(--agua-2)}

/* ---------- mapa ---------- */
#caixaMapa{position:relative;width:100%;height:min(60vh,460px);background:#dfe6e2;border-radius:var(--r);overflow:hidden;border:1px solid var(--linha);touch-action:none;cursor:grab}
@media (prefers-color-scheme: dark){ #caixaMapa{background:#1c2b28} }
#caixaMapa.arrastando{cursor:grabbing}
#telaTiles,#telaPinos{position:absolute;inset:0}
#rotaDia{position:absolute;inset:0;pointer-events:none}
#rotaDia path{fill:none;stroke:var(--agua);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.55;stroke-dasharray:2 9}
#telaTiles img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;opacity:0;transition:opacity .25s}
#telaTiles img.ok{opacity:1}
#fundoEsquema{position:absolute;inset:0;background-image:linear-gradient(rgba(125,150,145,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(125,150,145,.16) 1px,transparent 1px);background-size:48px 48px;display:none}
#caixaMapa.offline #fundoEsquema{display:block}
.pino{
  position:absolute;width:44px;height:44px;margin:-38px 0 0 -22px;display:flex;align-items:flex-start;justify-content:center;
  background:none;padding:0;
}
.pino i{
  display:block;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  background:var(--agua-2);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
  font-style:normal;display:flex;align-items:center;justify-content:center;
}
.pino i span{transform:rotate(45deg);font-size:12px;line-height:1;color:#fff;font-weight:800}
.pino.py i{background:var(--py)} .pino.ar i{background:var(--ar)}
.pino.nao i{background:#9aa8a6;opacity:.85}
.pino.sel i{background:var(--sol);width:32px;height:32px;z-index:5}
.pino.feita i{background:var(--ok)}
.pino i span svg{width:13px;height:13px}
.pino b{
  position:absolute;top:26px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10.5px;font-weight:700;background:rgba(255,255,255,.92);color:#15201f;
  padding:1px 5px;border-radius:5px;max-width:110px;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
}
#ferramentasMapa{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:6}
#ferramentasMapa button{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.95);color:#15201f;font-size:20px;font-weight:700;box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center}
#creditoMapa{position:absolute;left:6px;bottom:4px;font-size:9.5px;color:#4c5c5a;background:rgba(255,255,255,.75);padding:1px 5px;border-radius:4px;z-index:6}
#semRede{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;background:var(--alerta-fraco);color:var(--alerta);font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;display:none;border:1px solid rgba(194,65,12,.3)}
#caixaMapa.offline #semRede{display:block}
#fichaMapa{margin-top:10px}

/* ---------- custos ---------- */
.numero{font-variant-numeric:tabular-nums}
.resumoGrande{display:flex;flex-direction:column;gap:2px;padding:16px 14px;background:var(--agua);color:#fff;border-radius:var(--r)}
@media (prefers-color-scheme: dark){ .resumoGrande{background:#0b3d39} }
.resumoGrande .v{font-size:30px;font-weight:750;letter-spacing:-.02em}
.resumoGrande .r{font-size:12.5px;opacity:.85}
.gradeResumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.mini{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r-p);padding:11px 12px}
.mini .r{font-size:11.5px;color:var(--tinta-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mini .v{font-size:19px;font-weight:750;margin-top:2px}
.barra{height:8px;border-radius:999px;background:var(--linha);overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--agua-3);border-radius:999px}
.barra i.estourou{background:var(--alerta)}
.gasto{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--linha);align-items:center}
.gasto:last-child{border-bottom:0}
.gasto .cat{flex:0 0 38px;height:38px;border-radius:11px;background:var(--areia);display:flex;align-items:center;justify-content:center;font-size:18px}
.gasto .c{flex:1;min-width:0}
.gasto .d{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gasto .s{font-size:12px;color:var(--tinta-2);margin-top:2px}
.gasto .v{text-align:right;font-weight:700;font-size:15px;flex:0 0 auto}
.gasto .v small{display:block;font-weight:500;font-size:11px;color:var(--tinta-2)}
.acerto{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--linha);font-size:14.5px}
.acerto:last-child{border-bottom:0}
.acerto .q{font-weight:600}

/* ---------- formulários ---------- */
.campo{margin-bottom:12px}
.campo label{display:block;font-size:12.5px;font-weight:700;color:var(--tinta-2);margin-bottom:5px}
.campo input,.campo select,.campo textarea{
  width:100%;min-height:var(--toque);border:1px solid var(--linha);border-radius:var(--r-p);
  padding:11px 12px;background:var(--papel);font-size:16px;
}
.campo textarea{min-height:80px;resize:vertical;line-height:1.4}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--agua-3);outline-offset:-1px;border-color:var(--agua-3)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tripla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pessoas{display:flex;flex-wrap:wrap;gap:8px}
.pessoas button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--linha);background:var(--papel);font-size:14px;font-weight:600;color:var(--tinta-2)}
.pessoas button[aria-pressed="true"]{background:var(--agua-2);border-color:var(--agua-2);color:#fff}
.ajuda{font-size:12px;color:var(--tinta-2);margin-top:-6px;margin-bottom:12px;line-height:1.4}

/* ---------- folha (modal) ---------- */
#fundoFolha{position:fixed;inset:0;background:rgba(10,20,19,.45);z-index:60;display:none;backdrop-filter:blur(2px)}
#fundoFolha.on{display:block}
#folha{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--papel);
  border-radius:20px 20px 0 0;max-height:92vh;display:none;flex-direction:column;
  transform:translateY(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -6px 30px rgba(0,0,0,.2);
}
#folha.on{display:flex;transform:none}
#folhaCab{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--linha);flex:0 0 auto}
#folhaCab h3{flex:1;font-size:17px;min-width:0}
#folhaCorpo{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--base) + 16px)}
#folha .puxador{width:38px;height:4px;border-radius:999px;background:var(--linha);margin:8px auto 0;flex:0 0 auto}

/* ---------- abas ---------- */
#abas{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--papel);border-top:1px solid var(--linha);
  padding:6px calc(var(--dir) + 4px) calc(var(--base) + 6px) calc(var(--esq) + 4px);
}
#abas button{
  flex:1;min-width:0;min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:9.5px;font-weight:650;color:var(--tinta-2);letter-spacing:-.01em;
}
@media (min-width:360px){ #abas button{font-size:10.5px} }
#abas button .i{font-size:21px;line-height:1}
#abas button[aria-selected="true"]{color:var(--agua-2);background:rgba(28,143,134,.09)}
.vazio{text-align:center;padding:34px 20px;color:var(--tinta-2)}
.vazio .e{font-size:38px;display:block;margin-bottom:8px;opacity:.6}
.vazio p{margin:0 0 14px;font-size:14px;line-height:1.5}
#torrada{position:fixed;left:50%;bottom:calc(var(--base) + 78px);transform:translate(-50%,12px);z-index:70;background:var(--tinta);color:var(--areia);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
#torrada.on{opacity:1;transform:translate(-50%,0)}
.linhaDado{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--linha);font-size:14px}
.linhaDado:last-child{border-bottom:0}
.linhaDado .r{color:var(--tinta-2);flex:0 0 auto}
.linhaDado .v{text-align:right;font-weight:600}
svg.ico{flex:0 0 auto;vertical-align:-3px}
.buscaLinha{display:flex;gap:8px;margin-bottom:10px}
.buscaLinha input{flex:1;min-height:var(--toque);border:1px solid var(--linha);border-radius:var(--r-p);padding:11px 12px;background:var(--papel);font-size:16px}
.buscaLinha button{flex:0 0 auto}
.site{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-bottom:1px solid var(--linha);text-align:left;text-decoration:none;color:inherit;min-height:var(--toque)}
.site:last-child{border-bottom:0}
.site .n{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:6px}
.site .d{font-size:12px;color:var(--tinta-2);margin-top:2px;line-height:1.35}
.site .seta{margin-left:auto;color:var(--tinta-2);font-size:17px;flex:0 0 auto}
.compra{display:flex;align-items:stretch;border-bottom:1px solid var(--linha)}
.compra:last-child{border-bottom:0}
.compra .info{flex:1;min-width:0;padding:11px 12px;text-align:left;background:none}
.compra .n{font-weight:650;font-size:15px;line-height:1.3}
.compra .m{font-size:12.5px;color:var(--tinta-2);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px 9px;align-items:center}
.compra.comprado .n{text-decoration:line-through;color:var(--tinta-2)}
.ganho{font-weight:700;color:var(--ok)}
.perda{font-weight:700;color:var(--alerta)}
.sugestoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.item .nome svg.ico,.atr .n svg.ico{color:var(--agua-2);margin-right:2px}
.item.feita .nome,.item.feita .meta{opacity:.5;text-decoration:line-height}
.item.feita .nome{text-decoration:line-through;text-decoration-color:var(--tinta-2)}
.feito{flex:0 0 auto;width:var(--toque);height:var(--toque);display:flex;align-items:center;justify-content:center;color:transparent;margin:-4px -6px 0 0;background:none}
.feito b{width:27px;height:27px;border-radius:50%;border:1.8px solid var(--linha);display:flex;align-items:center;justify-content:center}
.feito[aria-pressed="true"] b{background:var(--ok);border-color:var(--ok);color:#fff}
.item .corpo{cursor:pointer}

const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function dataObj(iso){ const [a,m,d]=String(iso).split('-').map(Number); return new Date(a,m-1,d); }
function dataCurta(iso){ const d=dataObj(iso); return d.getDate()+' '+MESES[d.getMonth()]; }
function diaSemana(iso){ return DIAS[dataObj(iso).getDay()]; }
function diaSemanaC(iso){ return DIAS_C[dataObj(iso).getDay()]; }
function numDiaSemana(iso){ return dataObj(iso).getDay(); }
function listaDatas(ini,fim){ const r=[]; let d=dataObj(ini), f=dataObj(fim);
  while(d<=f){ r.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); d=new Date(d.getTime()+864e5); } return r; }
function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function minutos(hhmm){ if(!hhmm) return null; const [h,m]=hhmm.split(':').map(Number); return h*60+(m||0); }
function relogio(min){ if(min==null) return ''; min=((min%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
function duracaoTxt(m){ if(!m) return ''; const h=Math.floor(m/60), x=m%60; return h? (h+'h'+(x?String(x).padStart(2,'0'):'')) : (x+'min'); }
function moedaTxt(v,m='BRL'){
  const simb={BRL:'R$',USD:'US$',ARS:'AR$',PYG:'₲',EUR:'€'}[m]||m;
  const casas = m==='PYG'?0:2;
  return simb+' '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:casas,maximumFractionDigits:casas});
}
function distKm(a,b,c,d){
  if([a,b,c,d].some(v=>typeof v!=='number'||isNaN(v))) return null;
  const R=6371,r=Math.PI/180, dLat=(c-a)*r, dLon=(d-b)*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function tempoDeslocamento(km,cruzaFronteira){
  if(km==null) return null;
  let min = 6 + (km*1.35)/30*60;          // trânsito urbano ~30 km/h + embarque
  if(cruzaFronteira) min += 35;            // fila de fronteira
  return Math.round(min/5)*5;
}

/* ---------- estado e armazenamento ---------- */
const CHAVE='nossasviagens.v1';
const BD = {versao:1, viagens:[], ativa:null, aba:'roteiro'};
/* Substitui o CONTEÚDO do estado sem trocar o objeto. Reatribuir BD deixaria
   qualquer referência já guardada apontando para o estado antigo. */
function repor(novo){
  Object.keys(BD).forEach(k=>{ delete BD[k]; });
  Object.assign(BD,{versao:1,aba:'roteiro'},novo);
}

function carregar(){
  let bruto=null;
  try{ bruto = localStorage.getItem(CHAVE); }catch(e){ /* navegação privada */ }
  if(bruto){
    try{
      const d=JSON.parse(bruto);
      if(d && Array.isArray(d.viagens)){ Object.assign(BD,d); }
    }catch(e){ console.warn('dados ilegíveis, recomeçando',e); }
  }
  if(!BD.viagens.length){ BD.viagens=[sementeFoz()]; BD.ativa='foz2026'; }
  if(!BD.ativa || !BD.viagens.some(v=>v.id===BD.ativa)) BD.ativa=BD.viagens[0].id;
  BD.viagens.forEach(sanear);
}
function sanear(v){
  v.pessoas=v.pessoas||[]; v.destinos=v.destinos||[]; v.atracoes=v.atracoes||[];
  v.gastos=v.gastos||[]; v.voos=v.voos||[]; v.cambio=v.cambio||{BRL:1}; v.compras=v.compras||[];
  v.moedaBase=v.moedaBase||'BRL';
  v.atracoes.forEach(a=>{ if(a.sel===undefined) a.sel=!!a.dia; if(!a.moeda) a.moeda='BRL'; });
}
let salvarFalhou=false;
function salvar(){
  try{ localStorage.setItem(CHAVE,JSON.stringify(BD)); salvarFalhou=false; }
  catch(e){
    if(!salvarFalhou){ salvarFalhou=true; torrada('Não consegui salvar neste navegador. Exporte o backup na aba Viagem.'); }
  }
}
const viagem = ()=>BD.viagens.find(v=>v.id===BD.ativa)||BD.viagens[0];
const destino = (id)=>viagem().destinos.find(d=>d.id===id)||{nome:'—',pais:'BR',moeda:'BRL'};
const pessoa = (id)=>viagem().pessoas.find(p=>p.id===id)||{nome:'—'};

function paraBRL(valor,moeda){
  const v=viagem(); const t=(v.cambio&&v.cambio[moeda])||(moeda==='BRL'?1:null);
  if(t==null) return null;
  return Number(valor||0)*t;
}
function brlTxt(v){ return v==null?'—':moedaTxt(v,'BRL'); }

/* ---------- regras do roteiro ---------- */
function alternarFeita(id){
  const a=viagem().atracoes.find(x=>x.id===id); if(!a) return;
  a.feita=!a.feita; salvar();
}
function progressoRoteiro(){
  const v=viagem(), sel=v.atracoes.filter(a=>a.sel);
  return {total:sel.length, comDia:sel.filter(a=>a.dia).length, feitas:sel.filter(a=>a.feita).length};
}
function atracoesDoDia(data){
  return viagem().atracoes.filter(a=>a.sel && a.dia===data)
    .sort((a,b)=>(minutos(a.hora)??1e9)-(minutos(b.hora)??1e9));
}
function semDia(){ return viagem().atracoes.filter(a=>a.sel && !a.dia); }
function conflitoHorario(a){
  if(!a.janela || !a.hora || !a.dia) return null;
  const j=a.janela, ini=minutos(a.hora), fim=ini+(a.dur||0);
  const d=numDiaSemana(a.dia);
  if(j.dias && !j.dias.includes(d)) return 'fecha '+diaSemanaC(a.dia);
  const ab=minutos(j.abre), fe=minutos(j.fecha)||1440;
  const ent=j.entradaAte?minutos(j.entradaAte):null;
  if(ini<ab) return 'só abre '+j.abre;
  if(ent!=null && ini>ent) return 'última entrada '+j.entradaAte;
  if(ini>=fe) return 'já fechou às '+j.fecha;
  if(fim>fe+15) return 'fecha '+j.fecha+', antes do fim';
  return null;
}
function paisDe(a){ return destino(a.destinoId).pais; }
function trechoEntre(a,b){
  const km=distKm(a.lat,a.lon,b.lat,b.lon);
  if(km==null) return null;
  /* se um dos dois já É o deslocamento (transfer, travessia), o tempo dele conta, não somamos outro */
  if(a.ehTrecho||b.ehTrecho) return {km, min:5, cruza:false, embutido:true};
  const cruza = paisDe(a)!==paisDe(b);
  return {km, min:tempoDeslocamento(km,cruza), cruza};
}
function analisarDia(data){
  const itens=atracoesDoDia(data), avisos=[];
  for(let i=0;i<itens.length;i++){
    const c=conflitoHorario(itens[i]);
    if(c) avisos.push({tipo:'horario',atracao:itens[i],txt:itens[i].nome+' — '+c});
    if(i<itens.length-1){
      const t=trechoEntre(itens[i],itens[i+1]);
      const fim=minutos(itens[i].hora)+(itens[i].dur||0);
      const prox=minutos(itens[i+1].hora);
      if(t && prox!=null && fim!=null && prox-fim < t.min)
        avisos.push({tipo:'tempo',atracao:itens[i+1],txt:'Entre “'+itens[i].nome+'” e “'+itens[i+1].nome+'” faltam '+(t.min-(prox-fim))+' min para o deslocamento'});
      if(prox!=null && fim!=null && prox<fim)
        avisos.push({tipo:'sobrepoe',atracao:itens[i+1],txt:'“'+itens[i+1].nome+'” começa antes de “'+itens[i].nome+'” terminar'});
    }
  }
  return {itens,avisos};
}
function kmDoDia(data){
  const it=atracoesDoDia(data); let s=0;
  for(let i=0;i<it.length-1;i++){ const t=trechoEntre(it[i],it[i+1]); if(t) s+=t.km; }
  return s;
}
/* reordena o dia pelo vizinho mais próximo, mantendo o 1º item e as âncoras de horário rígido */
function otimizarDia(data){
  const it=atracoesDoDia(data);
  if(it.length<3) return 0;
  const antes=kmDoDia(data);
  const moveis=it.filter(a=>typeof a.lat==='number'&&typeof a.lon==='number');
  if(moveis.length<3) return 0;
  const ordem=[moveis[0]]; const resto=moveis.slice(1);
  while(resto.length){
    const u=ordem[ordem.length-1];
    let melhor=0,md=Infinity;
    resto.forEach((c,i)=>{ const k=distKm(u.lat,u.lon,c.lat,c.lon); if(k!=null&&k<md){md=k;melhor=i;} });
    ordem.push(resto.splice(melhor,1)[0]);
  }
  // redistribui os horários a partir do início do dia, respeitando deslocamentos
  let t=minutos(ordem[0].hora)??minutos('09:00');
  ordem.forEach((a,i)=>{
    if(i>0){ const tr=trechoEntre(ordem[i-1],a); t += (ordem[i-1].dur||0) + (tr?tr.min:15); }
    a.hora=relogio(t);
  });
  salvar();
  const depois=kmDoDia(data);
  return Math.max(0,antes-depois);
}

/* ---------- contas ---------- */
function gastoBRL(g){ return paraBRL(g.valor,g.moeda)??0; }
function totalGasto(filtro){ return viagem().gastos.filter(filtro||(()=>true)).reduce((s,g)=>s+gastoBRL(g),0); }
function previstoBRL(){
  const v=viagem(), n=Math.max(1,v.pessoas.length);
  return v.atracoes.filter(a=>a.sel).reduce((s,a)=>s+((paraBRL(a.custo,a.moeda)??0)*n),0);
}
function orcamentoTotal(){ return viagem().destinos.reduce((s,d)=>s+(Number(d.orcamento)||0),0); }
function saldos(){
  const v=viagem(), mapa={}; v.pessoas.forEach(p=>mapa[p.id]={pagou:0,deve:0});
  v.gastos.forEach(g=>{
    const val=gastoBRL(g);
    if(mapa[g.pagoPor]) mapa[g.pagoPor].pagou+=val;
    const div=(g.divididoCom&&g.divididoCom.length)?g.divididoCom:v.pessoas.map(p=>p.id);
    const cota=val/div.length;
    div.forEach(id=>{ if(mapa[id]) mapa[id].deve+=cota; });
  });
  return v.pessoas.map(p=>({...p,...mapa[p.id],saldo:mapa[p.id].pagou-mapa[p.id].deve}));
}
function cotaPorPessoa(){
  const v=viagem(); if(!v.cotaPY) return null;
  const usd=v.cambio.USD||1;
  const res=v.pessoas.map(p=>({...p,usado:0}));
  v.gastos.forEach(g=>{
    const d=v.destinos.find(x=>x.id===g.destinoId);
    if(!d || d.pais==='BR' || g.categoria!=='compras') return;
    const emUSD=(gastoBRL(g))/usd;
    const div=(g.divididoCom&&g.divididoCom.length)?g.divididoCom:v.pessoas.map(p=>p.id);
    div.forEach(id=>{ const r=res.find(x=>x.id===id); if(r) r.usado+=emUSD/div.length; });
  });
  return res;
}

function diasMontados(){
  const v=viagem();
  return listaDatas(v.inicio,v.fim).filter(d=>atracoesDoDia(d).length||v.voos.some(f=>f.data===d)).length;
}
function proximaParada(){
  const v=viagem(), hoje=hojeISO();
  if(hoje<v.inicio||hoje>v.fim) return null;
  const ag=new Date(), agora=ag.getHours()*60+ag.getMinutes();
  const doDia=atracoesDoDia(hoje).filter(a=>!a.feita);
  return doDia.find(a=>(minutos(a.hora)??0)+(a.dur||0)>=agora) || null;
}

          h.push(`<div class="desloc ${apertado?'aviso2':''}">

        }

    });

/* ============================================================
   TELA 3 — MAPA (leve, sem biblioteca externa)
   ============================================================ */
const MAPA={lat:-25.560,lon:-54.545,z:11.6,sel:null,dia:'todos',pronto:false,ok:0,erro:0,bloqueado:false};
/* Provedores de imagens de mapa. Regra de ouro: pedir só o que a tela mostra.
   Pré-carregar região inteira é "bulk downloading" e é proibido — foi o que
   nos bloqueou no OpenStreetMap na primeira versão. */
const PROVEDORES=[
  {id:'osm', n:'OpenStreetMap', u:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
   cred:'© OpenStreetMap', d:'Servidor de voluntários. Padrão. Só navegação normal.'},
  {id:'esri', n:'Esri World Street Map', u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
   cred:'Esri, HERE, Garmin, © OpenStreetMap', d:'Reserva, caso o OpenStreetMap bloqueie ou fique fora do ar.'},
  {id:'custom', n:'Outro provedor', u:'', cred:'© do provedor escolhido', d:'Cole o endereço com {z}, {x} e {y} — por exemplo o CARTO com a chave gratuita.'}
];
function provedorAtual(){
  const id=(BD.mapa&&BD.mapa.provedor)||'osm';
  const p=PROVEDORES.find(x=>x.id===id)||PROVEDORES[0];
  if(p.id==='custom') return Object.assign({},p,{u:(BD.mapa&&BD.mapa.custom)||PROVEDORES[0].u});
  return p;
}
function urlTile(z,x,y){
  if(typeof window.NV_TILES==='string' && window.NV_TILES) return window.NV_TILES+'/'+z+'/'+x+'/'+y+'.png';
  return provedorAtual().u.replace('{z}',z).replace('{x}',x).replace('{y}',y);
}
const Z_MIN=9, Z_MAX=18;
const lonX=(lon,z)=>(lon+180)/360*Math.pow(2,z)*256;
const latY=(lat,z)=>{const s=Math.max(-.9999,Math.min(.9999,Math.sin(lat*Math.PI/180)));
  return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*Math.pow(2,z)*256;};
const xLon=(x,z)=>x/(256*Math.pow(2,z))*360-180;
const yLat=(y,z)=>{const n=Math.PI-2*Math.PI*y/(256*Math.pow(2,z));
  return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));};

function telaMapa(){
  const v=viagem();
  const datas=listaDatas(v.inicio,v.fim).filter(d=>atracoesDoDia(d).length);
  $('#tela-mapa').innerHTML=`
    <div class="filtros" role="group" aria-label="Filtrar o mapa por dia">
      <button class="chip" data-fm="todos" aria-pressed="${MAPA.dia==='todos'}">Tudo</button>
      <button class="chip" data-fm="roteiro" aria-pressed="${MAPA.dia==='roteiro'}">✓ No roteiro</button>
      ${datas.map(d=>`<button class="chip" data-fm="${d}" aria-pressed="${MAPA.dia===d}">${diaSemanaC(d)} ${dataCurta(d)}</button>`).join('')}
    </div>
    <div id="caixaMapa">
      <div id="fundoEsquema"></div>
      <div id="telaTiles"></div>
      <svg id="rotaDia" aria-hidden="true"></svg>
      <div id="telaPinos"></div>
      <div id="semRede">sem imagens de mapa · pontos no lugar certo</div>
      <div id="ferramentasMapa">
        <button id="btMaisZoom" aria-label="Aproximar">＋</button>
        <button id="btMenosZoom" aria-label="Afastar">－</button>
        <button id="btCentrar" aria-label="Enquadrar tudo" style="font-size:16px">⤢</button>
      </div>
      <div id="creditoMapa"></div>
    </div>
    <div id="fichaMapa"></div>`;
  MAPA.pronto=true;
  $('#creditoMapa').textContent=provedorAtual().cred;
  ligarGestosMapa();
  enquadrarTudo();
  fichaMapa(null);
  sondarProvedor();
}
function pinosVisiveis(){
  const v=viagem();
  return v.atracoes.filter(a=>{
    if(typeof a.lat!=='number'||typeof a.lon!=='number') return false;
    if(MAPA.dia==='todos') return true;
    if(MAPA.dia==='roteiro') return !!a.sel;
    return a.dia===MAPA.dia;
  });
}
function enquadrarTudo(){
  const p=pinosVisiveis(); const c=$('#caixaMapa'); if(!c) return;
  const w=c.clientWidth||320, h=c.clientHeight||300;
  if(!p.length){ MAPA.lat=-25.56; MAPA.lon=-54.545; MAPA.z=11.6; return desenharMapa(); }
  const lats=p.map(a=>a.lat), lons=p.map(a=>a.lon);
  const n=Math.max(...lats), s=Math.min(...lats), l=Math.min(...lons), r=Math.max(...lons);
  MAPA.lat=(n+s)/2; MAPA.lon=(l+r)/2;
  let z=Z_MAX;
  for(;z>Z_MIN;z-=0.1){
    const dx=Math.abs(lonX(r,z)-lonX(l,z)), dy=Math.abs(latY(s,z)-latY(n,z));
    if(dx<w-90 && dy<h-90) break;
  }
  MAPA.z=Math.max(Z_MIN,Math.min(Z_MAX,z));
  desenharMapa();
}
function desenharMapa(){
  const c=$('#caixaMapa'); if(!c) return;
  const w=c.clientWidth, h=c.clientHeight;
  if(!w||!h) return;
  const zi=Math.max(Z_MIN,Math.min(Z_MAX,Math.round(MAPA.z)));
  const s=Math.pow(2,MAPA.z-zi);
  const cx=lonX(MAPA.lon,zi), cy=latY(MAPA.lat,zi);
  const ox=cx-(w/2)/s, oy=cy-(h/2)/s;
  const larg=w/s, alt=h/s;

  /* tiles */
  const tiles=$('#telaTiles'); const max=Math.pow(2,zi);
  let html='';
  if(MAPA.bloqueado){
    tiles.innerHTML=''; c.classList.add('offline');
    $('#semRede').textContent='provedor recusou as imagens · pontos no lugar certo';
  }
  const x0=Math.floor(ox/256), x1=Math.floor((ox+larg)/256);
  const y0=Math.floor(oy/256), y1=Math.floor((oy+alt)/256);
  for(let tx=x0;tx<=x1;tx++) for(let ty=y0;ty<=y1;ty++){
    if(MAPA.bloqueado) break;
    if(ty<0||ty>=max) continue;
    const nx=((tx%max)+max)%max;
    html+=`<img alt="" loading="lazy" data-t="1" src="${urlTile(zi,nx,ty)}" style="left:${(tx*256-ox)}px;top:${(ty*256-oy)}px">`;
  }
  tiles.style.transform=`scale(${s})`; tiles.style.transformOrigin='0 0';
  tiles.style.width=larg+'px'; tiles.style.height=alt+'px';
  if(!MAPA.bloqueado) tiles.innerHTML=html;
  $$('#telaTiles img').forEach(im=>{
    im.addEventListener('load',()=>{ im.classList.add('ok'); MAPA.ok++; c.classList.remove('offline'); },{once:true});
    im.addEventListener('error',()=>{ MAPA.erro++; if(MAPA.ok===0&&MAPA.erro>=3) c.classList.add('offline'); },{once:true});
  });

  /* rota do dia */
  const rota=$('#rotaDia');
  if(rota){
    rota.setAttribute('viewBox',`0 0 ${w} ${h}`); rota.setAttribute('width',w); rota.setAttribute('height',h);
    if(MAPA.dia!=='todos' && MAPA.dia!=='roteiro'){
      const seq=atracoesDoDia(MAPA.dia).filter(a=>typeof a.lat==='number');
      const pts=seq.map(a=>`${((lonX(a.lon,zi)-ox)*s).toFixed(1)},${((latY(a.lat,zi)-oy)*s).toFixed(1)}`);
      rota.innerHTML = pts.length>1 ? `<path d="M${pts.join(' L')}"/>` : '';
    } else rota.innerHTML='';
  }

  /* pinos */
  const p=pinosVisiveis();
  $('#telaPinos').innerHTML=p.map(a=>{
    const px=(lonX(a.lon,zi)-ox)*s, py=(latY(a.lat,zi)-oy)*s;
    if(px<-60||py<-60||px>w+60||py>h+60) return '';
    const pais=paisDe(a).toLowerCase();
    const cls=[ 'pino', pais, a.sel?'':'nao', a.feita?'feita':'', MAPA.sel===a.id?'sel':'' ].join(' ');
    const rot = MAPA.sel===a.id || MAPA.z>13.2;
    const ordem = (MAPA.dia!=='todos'&&MAPA.dia!=='roteiro') ? (atracoesDoDia(MAPA.dia).indexOf(a)+1) : 0;
    return `<button class="${cls}" style="left:${px}px;top:${py}px" data-pino="${a.id}" aria-label="${esc(a.nome)}">
      <i><span>${ordem>0?ordem:ico(CATEGORIAS[a.cat].i,14)}</span></i>${rot?`<b>${esc(a.nome.length>22?a.nome.slice(0,20)+'…':a.nome)}</b>`:''}</button>`;
  }).join('');
}
/* Uma única requisição, com CORS, para saber se o provedor está respondendo.
   É assim que descobrimos um bloqueio em vez de exibir a imagem de erro dele. */
async function sondarProvedor(){
  const u=urlTile(11,1279,1246);
  try{
    /* sem cache:'no-store' de propósito: a política do OpenStreetMap pede que
       não se mande diretiva de não-cachear. Uma requisição, e ela fica guardada. */
    const r=await fetch(u,{mode:'cors',credentials:'omit'});
    const antes=MAPA.bloqueado;
    MAPA.bloqueado = !r.ok;
    if(!r.ok){ avisoProvedor(r.status); desenharMapa(); }
    else { const a=$('#avisoProvedor'); if(a) a.remove(); if(antes) desenharMapa(); }
  }catch(e){ /* sem rede ou sem CORS: não dá para concluir nada */ }
}
function avisoProvedor(status){
  const cx=$('#tela-mapa'); if(!cx || $('#avisoProvedor')) return;
  const d=document.createElement('div');
  d.id='avisoProvedor'; d.className='aviso at'; d.style.marginTop='10px';
  d.innerHTML=`<span class="ic">${ico('aviso',16)}</span><div>
    <b>${esc(provedorAtual().n)} recusou as imagens${status?' (erro '+status+')':''}.</b>
    Os pontos continuam no lugar certo. Troque de provedor em <b>Viagem › Imagens do mapa</b>.
    <button class="bt fant" data-ir="viagem" style="min-height:40px;margin-top:8px;font-size:13px">Ir para Viagem</button></div>`;
  cx.appendChild(d);
}
function fichaMapa(id){

        ${a.precisao==='aprox'?`<span class="eti">local aprox.</span>`:''}
      </div></div>
      <button class="btIcone" data-fechaficha="1" aria-label="Fechar ficha">✕</button>
    </div>
    ${a.dica?`<p style="font-size:13.5px;color:var(--tinta-2);margin:10px 0 0;line-height:1.45">${esc(a.dica)}</p>`:''}
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="bt sec" data-marcar="${a.id}" style="flex:1;min-width:130px">${a.sel?'✓ No roteiro':'＋ Pôr no roteiro'}</button>
      <a class="bt fant" style="flex:1;min-width:130px;text-decoration:none" target="_blank" rel="noopener"
         href="https://www.google.com/maps/search/?api=1&query=${a.lat},${a.lon}">Abrir rota ↗</a>
    </div>
    <button class="bt fant larga" data-ficha="${a.id}" style="margin-top:8px">Ver ficha completa</button>
  </div>`;
}
function ligarGestosMapa(){
  const c=$('#caixaMapa'); if(!c||c._ligado) return; c._ligado=true;
  const pts=new Map(); let base=null, moveu=0;
  c.addEventListener('pointerdown',e=>{
    if(e.target.closest('#ferramentasMapa')||e.target.closest('.pino')) return;
    c.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moveu=0;
    c.classList.add('arrastando');
    if(pts.size===2){ const [a,b]=[...pts.values()]; base={d:Math.hypot(a.x-b.x,a.y-b.y),z:MAPA.z}; }
  });
  c.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    const ant=pts.get(e.pointerId); const dx=e.clientX-ant.x, dy=e.clientY-ant.y;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    moveu+=Math.abs(dx)+Math.abs(dy);
    if(pts.size===1){
      const zi=Math.max(Z_MIN,Math.min(Z_MAX,Math.round(MAPA.z))), s=Math.pow(2,MAPA.z-zi);
      MAPA.lon=xLon(lonX(MAPA.lon,zi)-dx/s,zi);
      MAPA.lat=yLat(latY(MAPA.lat,zi)-dy/s,zi);
      desenharMapa();
    } else if(pts.size===2 && base){
      const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(base.d>10){ MAPA.z=Math.max(Z_MIN,Math.min(Z_MAX,base.z+Math.log2(d/base.d))); desenharMapa(); }
    }
  });
  const fim=e=>{ pts.delete(e.pointerId); if(pts.size<2) base=null; if(!pts.size) c.classList.remove('arrastando'); };
  c.addEventListener('pointerup',fim); c.addEventListener('pointercancel',fim);
  c.addEventListener('wheel',e=>{ e.preventDefault(); MAPA.z=Math.max(Z_MIN,Math.min(Z_MAX,MAPA.z-Math.sign(e.deltaY)*0.4)); desenharMapa(); },{passive:false});
  let ultimoToque=0;
  c.addEventListener('click',e=>{
    const p=e.target.closest('.pino');
    if(p){ fichaMapa(p.dataset.pino); desenharMapa(); return; }
    if(e.target.closest('#ferramentasMapa')) return;
    const agora=Date.now();
    if(agora-ultimoToque<320 && moveu<12){ MAPA.z=Math.min(Z_MAX,MAPA.z+1); desenharMapa(); }
    ultimoToque=agora;
  });
  $('#btMaisZoom').onclick=()=>{ MAPA.z=Math.min(Z_MAX,MAPA.z+1); desenharMapa(); };
  $('#btMenosZoom').onclick=()=>{ MAPA.z=Math.max(Z_MIN,MAPA.z-1); desenharMapa(); };
  $('#btCentrar').onclick=()=>{ enquadrarTudo(); };
}

function cambioUSD(){ return viagem().cambio.USD||1; }
function compraBRL(c){ return (Number(c.alvoUSD)||0)*cambioUSD(); }
function economiaItem(c){
  const py=compraBRL(c), br=Number(c.precoBR)||0;
  if(!py||!br) return null;
  return {dif:br-py, pct:(br-py)/br*100};
}
function resumoCompras(){
  const v=viagem(), lista=v.compras||[];
  const aberto=lista.filter(c=>c.status!=='comprado');
  const alvo=aberto.reduce((s,c)=>s+compraBRL(c),0);
  const feito=lista.filter(c=>c.status==='comprado').reduce((s,c)=>s+compraBRL(c),0);
  const eco=lista.reduce((s,c)=>{ const e=economiaItem(c); return s+(e?e.dif:0); },0);
  return {total:lista.length, aberto:aberto.length, alvo, feito, eco};
}

        </div>`;}).join('')}

  }

  $('#tela-compras').innerHTML=h.join('');

    </div>`);
  });
  h.push(`</div>`);

  /* por categoria */
  const cats={};
  v.gastos.forEach(g=>{ cats[g.categoria]=(cats[g.categoria]||0)+gastoBRL(g); });
  const chaves=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]);
  if(chaves.length){
    h.push(`<div class="tituloSecao">Por categoria<span class="linha"></span></div><div class="cartao pad">`);
    const maior=cats[chaves[0]]||1;
    chaves.forEach(c=>h.push(`<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;align-items:center"><span style="display:flex;align-items:center;gap:6px">${CATEGORIAS[c]?ico(CATEGORIAS[c].i,16)+' '+CATEGORIAS[c].n:esc(c)}</span><b class="numero">${brlTxt(cats[c])}</b></div>
      <div class="barra"><i style="width:${cats[c]/maior*100}%"></i></div></div>`));

  }

  /* acerto de contas */
  if(v.gastos.length && v.pessoas.length>1){
    h.push(`<div class="tituloSecao">Acerto entre vocês<span class="linha"></span></div><div class="cartao">`);
    saldos().forEach(p=>{
      const s=p.saldo;
      h.push(`<div class="acerto"><span class="q">${esc(p.nome)}</span>
        <span style="text-align:right">
          <b class="numero" style="color:${Math.abs(s)<0.01?'var(--tinta-2)':(s>0?'var(--ok)':'var(--alerta)')}">${s>0?'recebe ':(s<0?'paga ':'quite ')}${Math.abs(s)>=0.01?brlTxt(Math.abs(s)):''}</b>
          <small style="display:block;font-size:11px;color:var(--tinta-2)">pagou ${brlTxt(p.pagou)} · cota ${brlTxt(p.deve)}</small>
        </span></div>`);
    });
    h.push(`</div>`);
  }

  /* lançamentos */
  h.push(`<div class="tituloSecao">Lançamentos<span class="linha"></span><span style="text-transform:none;letter-spacing:0">${v.gastos.length}</span></div>`);
  if(!v.gastos.length){
    h.push(`<div class="cartao"><div class="vazio"><span class="e">💰</span>
      <p>Nenhum gasto lançado ainda.<br>Lance na hora, ainda na fila do caixa — depois ninguém lembra.</p>
      <button class="bt" data-novo-gasto="1">＋ Lançar o primeiro</button></div></div>`);

    h.push(`<div class="filtros"><button class="chip" data-fg="todos" aria-pressed="${filtroGastoDestino==='todos'}">Todos</button>
      ${v.destinos.map(d=>`<button class="chip" data-fg="${d.id}" aria-pressed="${filtroGastoDestino===d.id}">${PAISES[d.pais].b} ${esc(d.nome)}</button>`).join('')}</div>`);
    let lista=v.gastos.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.criado||0)-(a.criado||0));
    if(filtroGastoDestino!=='todos') lista=lista.filter(g=>g.destinoId===filtroGastoDestino);
    h.push(`<div class="cartao">`);
    lista.forEach(g=>{
      const c=CATEGORIAS[g.categoria]||CATEGORIAS.outros;
      const div=(g.divididoCom&&g.divididoCom.length)?g.divididoCom:v.pessoas.map(p=>p.id);
      h.push(`<button class="gasto" data-gasto="${g.id}" style="width:100%;text-align:left">
        <span class="cat">${ico(c.i,19)}</span>
        <span class="c"><span class="d">${esc(g.descricao||c.n)}</span>
          <span class="s">${g.data?dataCurta(g.data)+' · ':''}${esc(destino(g.destinoId).nome)} · ${esc(pessoa(g.pagoPor).nome)} pagou · ÷${div.length}</span></span>
        <span class="v numero">${brlTxt(gastoBRL(g))}${g.moeda!=='BRL'?`<small>${moedaTxt(g.valor,g.moeda)}</small>`:''}</span>
      </button>`);
    });
    h.push(`</div>`);
  }
  $('#tela-custos').innerHTML=h.join('');
}

/* ============================================================
   FOLHA (janelas)
   ============================================================ */
function abrirFolha(titulo,html,depois){
  $('#folhaTitulo').textContent=titulo;
  $('#folhaCorpo').innerHTML=html;
  $('#folha').classList.add('on'); $('#fundoFolha').classList.add('on');
  document.body.style.overflow='hidden';
  $('#folhaCorpo').scrollTop=0;
  if(depois) depois();
  const foco=$('#folhaCorpo input,#folhaCorpo select,#folhaCorpo textarea,#folhaCorpo button');
  if(foco && foco.type!=='number') setTimeout(()=>{},0);
}
function fecharFolha(){
  $('#folha').classList.remove('on'); $('#fundoFolha').classList.remove('on');
  document.body.style.overflow='';
  /* limpa o conteúdo para não deixar campos antigos escondidos no documento */
  setTimeout(()=>{ if(!$('#folha').classList.contains('on')){ $('#folhaCorpo').innerHTML=''; $('#folhaTitulo').textContent=''; } },240);
}
function selDestinos(sel){ return viagem().destinos.map(d=>`<option value="${d.id}" ${sel===d.id?'selected':''}>${PAISES[d.pais].b} ${esc(d.nome)}</option>`).join(''); }
function selDias(sel){
  const v=viagem();
  return `<option value="">— sem dia —</option>`+listaDatas(v.inicio,v.fim).map(d=>`<option value="${d}" ${sel===d?'selected':''}>${diaSemanaC(d)} ${dataCurta(d)}</option>`).join('');
}
function selMoedas(sel){ return Object.keys(viagem().cambio).map(m=>`<option value="${m}" ${sel===m?'selected':''}>${m}</option>`).join(''); }
function selCats(sel){ return Object.keys(CATEGORIAS).map(c=>`<option value="${c}" ${sel===c?'selected':''}>${CATEGORIAS[c].e} ${CATEGORIAS[c].n}</option>`).join(''); }

      <button type="button" class="bt larga perigo" data-apagar-atracao="${a.id}" style="margin-top:8px">Apagar atração</button>`}
    </form>`,()=>{
      $('#formAtracao').addEventListener('submit',e=>{
        e.preventDefault();
        const v=viagem();
        const lat=parseFloat($('#fa_lat').value), lon=parseFloat($('#fa_lon').value);
        Object.assign(a,{
          nome:$('#fa_nome').value.trim()||'Sem nome',
          destinoId:$('#fa_dest').value, cat:$('#fa_cat').value,
          dia:$('#fa_dia').value||null, hora:$('#fa_hora').value||null,
          dur:parseInt($('#fa_dur').value)||0,
          custo:parseFloat($('#fa_custo').value)||0, moeda:$('#fa_moeda').value,
          lat:isNaN(lat)?null:lat, lon:isNaN(lon)?null:lon,

        });

        salvar(); fecharFolha(); desenhar(); torrada(nova?'Atração criada':'Atração salva');
      });
    });
}

/* --- encaixar no dia (rápido) --- */
function folhaEncaixar(id){
  const a=viagem().atracoes.find(x=>x.id===id); if(!a) return;
  const v=viagem(), datas=listaDatas(v.inicio,v.fim);
  abrirFolha('Encaixar '+a.nome,`
    <p style="font-size:13.5px;color:var(--tinta-2);margin:0 0 14px;line-height:1.45">Escolha o dia. O horário sugerido é logo depois da última parada, já contando o deslocamento.</p>
    ${datas.map(d=>{
      const it=atracoesDoDia(d);
      const ult=it[it.length-1];
      let sug='09:00';
      if(ult){ const t=trechoEntre(ult,a); sug=relogio((minutos(ult.hora)||0)+(ult.dur||0)+(t?t.min:20)); }
      const simulada=Object.assign({},a,{dia:d,hora:sug});
      const c=conflitoHorario(simulada);
      return `<button class="bt larga sec" data-encaixar-em="${a.id}|${d}|${sug}" style="justify-content:space-between;margin-bottom:8px;text-align:left">
        <span><b>${diaSemanaC(d)} ${dataCurta(d)}</b> <span style="font-weight:400;color:var(--tinta-2);font-size:13px">· ${it.length} parada${it.length===1?'':'s'}</span></span>
        <span style="font-size:13px;color:${c?'var(--alerta)':'var(--agua-2)'};font-weight:700">${c?'⛔ '+c:sug}</span>
      </button>`;
    }).join('')}
    <button class="bt larga fant" data-ficha="${a.id}" style="margin-top:6px">Abrir ficha completa</button>`);
}

      <div class="dupla">

      $('#fg_valor').addEventListener('input',conv); $('#fg_moeda').addEventListener('change',conv); conv();
      $('#fg_dest').addEventListener('change',()=>{

function folhaEditarViagem(nova){
  const v = nova? {id:idNovo('vi'),nome:'',inicio:hojeISO(),fim:hojeISO(),moedaBase:'BRL',cambio:{BRL:1,USD:5.12},
                   pessoas:[{id:idNovo('p'),nome:'Rodolfo'},{id:idNovo('p'),nome:'Rita'}],
                   destinos:[],atracoes:[],gastos:[],voos:[]} : viagem();
  abrirFolha(nova?'Nova viagem':'Editar viagem',`
    <form id="formViagem">
      <div class="campo"><label for="fv_nome">Nome da viagem</label><input id="fv_nome" value="${esc(v.nome)}" required placeholder="Ex.: Chile em julho"></div>
      <div class="dupla">
        <div class="campo"><label for="fv_ini">Começa</label><input id="fv_ini" type="date" value="${v.inicio}" required></div>
        <div class="campo"><label for="fv_fim">Termina</label><input id="fv_fim" type="date" value="${v.fim}" required></div>
      </div>
      <div class="campo"><label for="fv_pessoas">Quem vai (separado por vírgula)</label>
        <input id="fv_pessoas" value="${esc(v.pessoas.map(p=>p.nome).join(', '))}" placeholder="Rodolfo, Rita"></div>
      ${nova?`<div class="campo"><label for="fv_dest">Destinos (um por linha: nome, país BR/PY/AR/…)</label>
        <textarea id="fv_dest" placeholder="Santiago, CL&#10;Valparaíso, CL"></textarea></div>`:''}
      <button type="submit" class="bt larga">${nova?'Criar viagem':'Salvar'}</button>
    </form>`,()=>{
      $('#formViagem').addEventListener('submit',e=>{
        e.preventDefault();
        const ini=$('#fv_ini').value, fim=$('#fv_fim').value;
        if(fim<ini) return torrada('A data final é antes da inicial.');
        v.nome=$('#fv_nome').value.trim()||'Viagem'; v.inicio=ini; v.fim=fim;
        const nomes=$('#fv_pessoas').value.split(',').map(s=>s.trim()).filter(Boolean);
        if(nomes.length){
          const antigos=v.pessoas.slice();
          v.pessoas=nomes.map((n,i)=>antigos[i]?Object.assign(antigos[i],{nome:n}):{id:idNovo('p'),nome:n});
        }
        if(nova){
          const linhas=($('#fv_dest').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
          v.destinos=linhas.map(l=>{ const [n,p]=l.split(',').map(s=>s.trim());
            return {id:idNovo('d'),nome:n||'Destino',pais:(p||'BR').toUpperCase().slice(0,2),moeda:'BRL',lat:null,lon:null,orcamento:0}; });
          if(!v.destinos.length) v.destinos=[{id:idNovo('d'),nome:v.nome,pais:'BR',moeda:'BRL',lat:null,lon:null,orcamento:0}];
          v.destinos.forEach(d=>{ if(!PAISES[d.pais]) PAISES[d.pais]={n:d.pais,b:'🏳️'}; });
          BD.viagens.push(v); BD.ativa=v.id;
        }
        /* atracoes fora do novo intervalo perdem o dia */
        const validas=listaDatas(v.inicio,v.fim);
        v.atracoes.forEach(a=>{ if(a.dia && !validas.includes(a.dia)) a.dia=null; });
        salvar(); fecharFolha(); desenhar(); torrada(nova?'Viagem criada':'Viagem salva');
      });
    });
}

/* ============================================================
   BACKUP
   ============================================================ */
function exportar(){
  const txt=JSON.stringify(BD,null,2);
  const blob=new Blob([txt],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='nossas-viagens-'+hojeISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  torrada('Backup gerado');
}
function importar(){
  const i=document.createElement('input'); i.type='file'; i.accept='application/json,.json';
  i.onchange=()=>{
    const f=i.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      let d;
      try{
        d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.viagens)||!d.viagens.length) throw new Error('formato');
      }catch(e){ return torrada('Arquivo inválido. Use um backup exportado por este app.'); }
      d.viagens.forEach(sanear);
      const nomes=d.viagens.map(v=>v.nome).join(', ');
      const jaTem=BD.viagens.length;
      abrirFolha('Importar backup',`
        <p style="font-size:14.5px;line-height:1.5;margin:0 0 6px">O arquivo traz <b>${d.viagens.length} viagem${d.viagens.length>1?'s':''}</b>: ${esc(nomes)}.</p>
        <p style="font-size:13px;color:var(--tinta-2);line-height:1.45;margin:0 0 18px">Neste aparelho há ${jaTem} viagem${jaTem>1?'s':''} guardada${jaTem>1?'s':''}. Escolha o que fazer.</p>
        <button class="bt larga" id="btSomar">Somar às minhas viagens</button>
        <p class="ajuda" style="margin-top:6px">Mantém o que já existe aqui e acrescenta as do arquivo como viagens separadas. É o seguro.</p>
        <button class="bt larga perigo" id="btSubstituir" style="margin-top:10px">Substituir tudo pelo arquivo</button>
        <p class="ajuda" style="margin-top:6px;margin-bottom:0">Apaga as ${jaTem} viagem${jaTem>1?'s':''} deste aparelho, com gastos e listas, e deixa só o que veio no arquivo.</p>`,()=>{
        $('#btSubstituir').onclick=()=>{
          repor(d);
          if(!BD.ativa||!BD.viagens.some(v=>v.id===BD.ativa)) BD.ativa=BD.viagens[0].id;
          BD.viagens.forEach(sanear);
          salvar(); fecharFolha(); irPara('roteiro'); torrada('Backup restaurado');
        };
        $('#btSomar').onclick=()=>{
          const usados=new Set(BD.viagens.map(v=>v.id));
          let primeira=null;
          d.viagens.forEach(v=>{
            if(usados.has(v.id)){ v.id=idNovo('vi'); v.nome=v.nome+' (importada)'; }
            usados.add(v.id); BD.viagens.push(v);
            if(!primeira) primeira=v.id;
          });
          BD.ativa=primeira||BD.ativa;
          salvar(); fecharFolha(); irPara('roteiro'); torrada(d.viagens.length+' viagem(ns) acrescentada(s)');
        };
      });
    };
    r.readAsText(f);
  };
  i.click();
}
function confirmar(titulo,texto,rotulo,acao){
  abrirFolha(titulo,`<p style="font-size:14.5px;line-height:1.5;margin:0 0 18px">${texto}</p>
    <button class="bt larga perigo" id="btConfirma">${rotulo}</button>
    <button class="bt larga sec" id="btCancela" style="margin-top:8px">Cancelar</button>`,()=>{
      $('#btConfirma').onclick=()=>{ acao(); };
      $('#btCancela').onclick=fecharFolha;
    });
}

/* ============================================================
   DESENHO GERAL E EVENTOS
   ============================================================ */
let desenhar = function(){
  const v=viagem();
  $('#tituloViagem').textContent=v.nome;
  $('#subTituloViagem').textContent=`${dataCurta(v.inicio)}–${dataCurta(v.fim)} · ${v.pessoas.length} pessoas`;
  $('#rotuloViagens').textContent=BD.viagens.length>1?BD.viagens.length+' viagens':'Viagens';
  medirTopo();
  if(BD.aba==='roteiro') telaRoteiro();
  else if(BD.aba==='atracoes') telaAtracoes();
  else if(BD.aba==='mapa') telaMapa();
  else if(BD.aba==='compras') telaCompras();
  else if(BD.aba==='custos') telaCustos();
  else telaViagem();
}
function irPara(aba){
  BD.aba=aba; salvar();
  $$('#abas button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.aba===aba)));
  $$('.tela').forEach(t=>t.classList.toggle('on',t.id==='tela-'+aba));
  desenhar();
  window.scrollTo({top:0});
}
$('#abas').addEventListener('click',e=>{ const b=e.target.closest('[data-aba]'); if(b) irPara(b.dataset.aba); });
$('#btViagens').addEventListener('click',folhaViagens);
$('#btFecharFolha').addEventListener('click',fecharFolha);
$('#fundoFolha').addEventListener('click',fecharFolha);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#folha').classList.contains('on')) fecharFolha(); });

document.addEventListener('click',e=>{
  const al=s=>e.target.closest('['+s+']');
  let b;
  if(b=al('data-ir')) return irPara(b.dataset.ir);
  if(b=al('data-marcar')){
    const a=viagem().atracoes.find(x=>x.id===b.dataset.marcar); if(!a) return;
    a.sel=!a.sel; if(!a.sel){ a.dia=null; a.hora=null; a.feita=false; }
    salvar(); desenhar();
    if(BD.aba==='mapa'){ fichaMapa(a.id); desenharMapa(); }
    if(a.sel && !a.dia) folhaEncaixar(a.id); else torrada('Tirada do roteiro');
    return;
  }
  if(b=al('data-avisos')){ const d=b.dataset.avisos; abertos.has(d)?abertos.delete(d):abertos.add(d); telaRoteiro(); return; }
  if(b=al('data-vermais')){ const i=b.dataset.vermais; abertos.has(i)?abertos.delete(i):abertos.add(i); telaRoteiro(); return; }
  if(b=al('data-feito')){ alternarFeita(b.dataset.feito); desenhar(); return; }
  if(b=al('data-ficha')) return folhaAtracao(b.dataset.ficha);
  if(b=al('data-encaixar')) return folhaEncaixar(b.dataset.encaixar);
  if(b=al('data-encaixar-em')){
    const [id,dia,hora]=b.dataset.encaixarEm.split('|');
    const a=viagem().atracoes.find(x=>x.id===id); if(!a) return;
    a.dia=dia; a.hora=hora; a.sel=true;
    salvar(); fecharFolha(); irPara('roteiro'); torrada('Encaixada em '+diaSemanaC(dia)+' às '+hora);
    return;
  }
  if(b=al('data-alternar')){
    const a=viagem().atracoes.find(x=>x.id===b.dataset.alternar); if(!a) return;
    a.sel=!a.sel; if(!a.sel){a.dia=null;a.hora=null;}
    salvar(); fecharFolha(); desenhar(); torrada(a.sel?'Posta no roteiro':'Tirada do roteiro'); return;
  }
  if(b=al('data-apagar-atracao')){
    const id=b.dataset.apagarAtracao;
    return confirmar('Apagar atração','Isso remove a atração da lista e do roteiro. Não dá para desfazer.','Apagar',()=>{
      const v=viagem(); v.atracoes=v.atracoes.filter(x=>x.id!==id);
      salvar(); fecharFolha(); desenhar(); torrada('Atração apagada');
    });
  }
  if(b=al('data-otimizar')){
    const data=b.dataset.otimizar, ganho=otimizarDia(data);
    desenhar();
    torrada(ganho>0.3?('Ordem refeita — '+ganho.toFixed(1)+' km a menos'):'A ordem já estava boa');
    return;
  }
  if(al('data-nova-atracao')) return folhaAtracao(null);
  if(al('data-abrir-sites')){ abertos.has('sites')?abertos.delete('sites'):abertos.add('sites'); telaCompras(); return; }
  if(al('data-nova-compra')) return folhaCompra(null);
  if(b=al('data-sugestao')) return folhaCompra(null,b.dataset.sugestao);
  if(b=al('data-compra')) return folhaCompra(b.dataset.compra);
  if(b=al('data-avancar')){
    const c=viagem().compras.find(x=>x.id===b.dataset.avancar); if(!c) return;
    const seq=['procurar','achado','comprado'];
    const prox=seq[(seq.indexOf(c.status||'procurar')+1)%3];
    if(prox==='comprado') return folhaCompra(c.id,null,'comprado');
    c.status=prox; salvar(); telaCompras(); torrada(prox==='achado'?'Preço encontrado':'Voltou para procurar');
    return;
  }
  if(b=al('data-apagar-compra')){
    const id=b.dataset.apagarCompra;
    return confirmar('Tirar da lista','O item sai da lista de compras. Um gasto já lançado em Custos continua lá.','Tirar',()=>{
      const v=viagem(); v.compras=v.compras.filter(x=>x.id!==id);
      salvar(); fecharFolha(); desenhar(); torrada('Item removido');
    });
  }
  if(al('data-novo-gasto')) return folhaGasto(null);
  if(b=al('data-rapido')) return folhaGasto(null,b.dataset.rapido);
  if(b=al('data-gasto')) return folhaGasto(b.dataset.gasto);
  if(b=al('data-apagar-gasto')){
    const id=b.dataset.apagarGasto;
    return confirmar('Apagar lançamento','O valor sai das somas e do acerto de contas.','Apagar',()=>{
      const v=viagem(); v.gastos=v.gastos.filter(x=>x.id!==id);
      salvar(); fecharFolha(); desenhar(); torrada('Lançamento apagado');
    });
  }
  if(b=al('data-fd')){ filtroDestino=b.dataset.fd; telaAtracoes(); return; }
  if(b=al('data-fc')){ filtroCat = filtroCat===b.dataset.fc?'todas':b.dataset.fc; telaAtracoes(); return; }
  if(b=al('data-fs')){ filtroSel=b.dataset.fs; telaAtracoes(); return; }
  if(al('data-limparfiltro')){ filtroDestino='todos'; filtroCat='todas'; filtroSel='todas'; telaAtracoes(); return; }
  if(b=al('data-fg')){ filtroGastoDestino=b.dataset.fg; telaCustos(); return; }
  if(b=al('data-fm')){ MAPA.dia=b.dataset.fm; telaMapa(); return; }
  if(al('data-fechaficha')){ fichaMapa(null); desenharMapa(); return; }
  if(b=al('data-abrir-viagem')){ BD.ativa=b.dataset.abrirViagem; salvar(); fecharFolha(); irPara('roteiro'); return; }
  if(al('data-nova-viagem')) return folhaEditarViagem(true);
  if(al('data-editar-viagem')) return folhaEditarViagem(false);
  if(al('data-destinos')) return folhaDestinos();
  if(al('data-novo-destino')){
    const v=viagem(); v.destinos.push({id:idNovo('d'),nome:'Novo destino',pais:'BR',moeda:'BRL',lat:null,lon:null,orcamento:0});
    salvar(); folhaDestinos(); return;
  }
  if(b=al('data-apagar-viagem')){
    const id=b.dataset.apagarViagem;
    return confirmar('Apagar viagem','Some tudo dessa viagem: roteiro, atrações e gastos. Exporte um backup antes se tiver dúvida.','Apagar viagem',()=>{
      BD.viagens=BD.viagens.filter(v=>v.id!==id);
      if(!BD.viagens.length) BD.viagens=[sementeFoz()];
      BD.ativa=BD.viagens[0].id; salvar(); fecharFolha(); irPara('roteiro'); torrada('Viagem apagada');
    });
  }
  if(al('data-limpar-tiles')){
    return confirmar('Esquecer as imagens do mapa','Apaga só as imagens de fundo guardadas no aparelho. Seus dados de viagem não são tocados. Use isto se o mapa estiver mostrando avisos de erro no lugar do desenho.','Esquecer imagens',async ()=>{
      let n=0;
      try{ const ks=await caches.keys();
        for(const k of ks) if(/^tiles/.test(k)){ await caches.delete(k); n++; } }catch(e){}
      fecharFolha(); MAPA.ok=0; MAPA.erro=0;
      torrada(n?'Imagens esquecidas — abra o Mapa de novo':'Nada guardado para apagar');
    });
  }
  if(al('data-exportar')) return exportar();
  if(al('data-importar')) return importar();
  if(al('data-zerar')){
    return confirmar('Apagar tudo','Todas as viagens somem deste aparelho e o app volta com a viagem de Foz do Iguaçu de fábrica.','Apagar tudo',()=>{
      try{ localStorage.removeItem(CHAVE); }catch(e){}
      repor({viagens:[sementeFoz()],ativa:'foz2026'});
      salvar(); fecharFolha(); irPara('roteiro'); torrada('Tudo zerado');
    });
  }
});
document.addEventListener('change',e=>{
  const pr=e.target.closest('#fp_prov');
  if(pr){
    BD.mapa=BD.mapa||{}; BD.mapa.provedor=pr.value; salvar();
    const cx=$('#fp_caixaCustom'); if(cx) cx.hidden = pr.value!=='custom';
    MAPA.bloqueado=false; MAPA.ok=0; MAPA.erro=0;
    torrada('Provedor trocado — abra o Mapa para conferir');
    return;
  }
  const cu=e.target.closest('#fp_custom');
  if(cu){ BD.mapa=BD.mapa||{}; BD.mapa.custom=cu.value.trim(); salvar(); MAPA.ok=0; MAPA.erro=0; torrada('Endereço salvo'); return; }
  const c=e.target.closest('[data-cambio]');
  if(c){ const v=viagem(); v.cambio[c.dataset.cambio]=parseFloat(c.value)||0; salvar(); torrada('Câmbio atualizado'); return; }
  const k=e.target.closest('[data-check]');
  if(k){ const v=viagem(); v.checklist=v.checklist||[];
    const id=k.dataset.check;
    v.checklist = k.checked ? [...new Set([...v.checklist,id])] : v.checklist.filter(x=>x!==id);
    salvar(); return; }
});
function medirTopo(){
  const b=$('#barraTopo'); if(b) document.documentElement.style.setProperty('--alturaTopo',b.offsetHeight+'px');
}
let redimensiona;
window.addEventListener('resize',()=>{ clearTimeout(redimensiona); redimensiona=setTimeout(()=>{ medirTopo(); if(BD.aba==='mapa'&&MAPA.pronto) desenharMapa(); },160); });
window.addEventListener('orientationchange',()=>setTimeout(()=>{ if(BD.aba==='mapa'&&MAPA.pronto) enquadrarTudo(); },320));

/* ---------- PWA: instalação e service worker ---------- */
let convitePWA=null;
const rodandoInstalado = matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
const ehIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); convitePWA=e; pintarInstalacao(); });
window.addEventListener('appinstalled',()=>{ convitePWA=null; torrada('App instalado'); pintarInstalacao(); });
function pintarInstalacao(){
  const bt=$('#btInstalar'); if(!bt) return;
  const ios=$('#dicaIOS'), ja=$('#jaInstalado');
  bt.hidden = !convitePWA || rodandoInstalado;
  ios.hidden = !(ehIOS && !rodandoInstalado);
  ja.hidden = !rodandoInstalado;
  bt.onclick = async ()=>{ if(!convitePWA) return; convitePWA.prompt(); await convitePWA.userChoice; convitePWA=null; pintarInstalacao(); };
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('service worker não registrou',e));
    let recarregou=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(recarregou) return; recarregou=true; location.reload();
    });
  });
}
const desenharOriginal = desenhar;
desenhar = function(){ desenharOriginal(); if(BD.aba==='viagem') pintarInstalacao(); };

/* ---------- partida ---------- */
$$('#abas .i[data-ic]').forEach(el=>el.innerHTML=ico(el.dataset.ic,22));
carregar();
medirTopo(); setTimeout(medirTopo,300);
if(!['roteiro','atracoes','mapa','compras','custos','viagem'].includes(BD.aba)) BD.aba='roteiro';
irPara(BD.aba);
window.NV={BD,viagem,salvar,desenhar,analisarDia,otimizarDia,saldos,cotaPorPessoa,distKm,MAPA};
</script>
